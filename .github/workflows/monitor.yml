name: MOPS 資安重訊監控

on:
  schedule:
    # 每天台灣時間 09:50（UTC 01:50）起跑，留緩衝讓信件約 10:00 前後送達
    # 註：GitHub 排程在尖峰/整點時段可能延遲，故用非整點分鐘較準
    - cron: '50 1 * * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write  # 允許 push 報告回 repo

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          # 不設 QUERY_DAYS：預設查詢「當天回推一個整月」
        run: python mops_scraper.py
